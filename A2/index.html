<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <title>The Movie Database</title>
    <meta
      name="description"
      content="The Movie Database (TMDB) is a popular, user editable database for movies and TV shows."
    >
    <link href="global.css" rel="stylesheet">

  <body>
    <!-- TODO:

button radius, required font, colors, image sizes
-->
    <header>
      <a href="https://www.themoviedb.org/" target="_blank"
        ><img src="/assets/logo.svg" height="25" alt="The Movie Database"></a
      >

      <nav>
        <ul>
          <li><a href="">Buscador</a></li>
          <li><a href="contacte.html">Contacte</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div id="presentation">
        <h1>BUSCA UNA PEL·LÍCULA</h1>
        <p>Milions de títols, un sol cercador.</p>
        <search>
          <form method="get" action="https://www.themoviedb.org/search">
            <label for="movie"></label>
            <input
              type="search"
              name="query"
              id="movie"
              placeholder="Cerca una pel·lícula, per exemple «Dune»..."
              required
            >
            <button type="submit">Cerca</button>
          </form>
        </search>
      </div>
      <div>
        <h2>RESULTATS</h2>

        <div id="results-cards">
          <div>
            <img src="assets/duneparttwo.jpeg" width="250" alt="Dune: Part Two">
            <div>
              <h3>Dune: Part Two</h3>
              <p>2024</p>
            </div>
          </div>
          <div>
            <img
              src="assets/tlotrtwotowers.jpeg"
              width="250"
              alt="The Lord of the Rings: The Two Towers"
            >
            <div>
              <h3>The Lord of the Rings: The Two Towers</h3>
              <p>2002</p>
            </div>
          </div>
          <div>
            <img
              src="assets/spidermanbrandnewday.jpeg"
              width="250"
              alt="Spider-Man: Brand New Day"
            >
            <div>
              <h3>Spider-Man: Brand New Day</h3>
              <p>2026</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>&#169; 2026 The Movie Database &mdash; Maqueta de disseny</p>
    </footer>
  </body>
</html>
