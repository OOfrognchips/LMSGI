    <body>
        <header>
            <a href="https://www.themoviedb.org/" target="_blank">
                <img
                    src="/assets/logo.svg"
                    height="25"
                    alt="The Movie Database"
                >
            </a>
            <nav>
                <ul>
                    <li>
                        <a href="index.html" target="_self">Buscador</a>

        <main>
            <div id="credits">
                <!-- img src="" -->
                <h3>Jem Gayolà Del Pozo</h3>
                <span> Alumne/a - Desenvolupament web </span>
                <p>Lorem ipsum dolor set amer sit</p>
            </div>
            <div id="contact-us">
                <p>Envia'ns un missatge</p>
                <form>
                    <label for="name"> Nom i cognoms </label>
                    <input
                        type="text"
                        placeholder="El teu nom complet"
                        required
                        id="name"
                        name="name"
                    >
                    <label for="e-mail"> Correu electrònic </label>
                    <input
                        type="email"
                        placeholder="nom@exemple.cat"
                        required
                        id="e-mail"
                        name="e-mail"
                    >
                    <label for="subject"> Assumpte </label>
                    <input
                        type="text"
                        placeholder="Sobre què ens vols escriure?"
                        required
                        id="subject"
                        name="subject"
                    >
                    <label for="message"> Missatge </label>
                    <textarea
                        type="text"
                        placeholder="Escriu aquí el teu missatge..."
                        required
                        id="message"
                        name="message"
                    ></textarea>
                    <button type="submit">Enviar</button>
                </form>
            </div>
        </main>
        <footer>
            <p>&#169; 2026 The Movie Database &mdash; Maqueta de disseny</p>
        </footer>
